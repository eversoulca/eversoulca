name: Deploy ASP.NET Core to Azure Web App

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    environment: production
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v3

    - name: Setup Node
      uses: actions/setup-node@v3
      with:
        node-version: '20'
    - name: Install frontend deps
      working-directory: eversoulca/frontend
      run: npm install
    - name: Build frontend
      working-directory: eversoulca/frontend
      run: npm run build

    - name: Copy static assets to API
      run: |
        rm -rf backend/UserApi/wwwroot
        mkdir -p backend/UserApi/wwwroot
        cp -a eversoulca/frontend/dist/. backend/UserApi/wwwroot/

    - name: Setup .NET
      uses: actions/setup-dotnet@v3
      with:
        dotnet-version: '8.0.x'
    - name: Build backend
      run: dotnet build backend/UserApi/UserApi.csproj --configuration Release
    - name: Publish
      run: dotnet publish backend/UserApi/UserApi.csproj -c Release -o ./publish
    - name: Deploy to Azure WebApp
      uses: azure/webapps-deploy@v2
      with:
        app-name: ${{ secrets.AZURE_WEBAPP_NAME }}
        publish-profile: ${{ secrets.AZURE_WEBAPP_PUBLISH_PROFILE }}
        package: ./publish
